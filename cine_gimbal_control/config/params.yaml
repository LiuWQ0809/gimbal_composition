gimbal_tracking_node:
  ros__parameters:
    image_width: 1920
    image_height: 1080
    
    # Kp Configuration
    # CORRECTED LOGIC (2026-01-08):
    # Error X < 0 (Right) -> Need Yaw < 0 (Right) -> Kp POSITIVE.
    kp_yaw: 0.000005
    ki_yaw: 0.0000001 # Small integral to fix steady-state error
    kd_yaw: 0.0
    
    kp_pitch: 0.000005
    ki_pitch: 0.0000001
    kd_pitch: 0.0
    
    # Reference Focal Length (pixels)
    default_focal_length: 1000.0  
    
    # Safety Limits
    max_velocity_rpm: 2.0  
    max_step_rad: 0.002    
    limit_pitch_rad: 0.78  # +/- 45 degrees
    limit_yaw_rad: 1.57    # +/- 90 degrees
    
    # Reduced deadband to be more responsive but still filter jitter.
    deadband_x: 50
    deadband_y: 50
    confidence_threshold: 0.5
    cmd_rate_hz: 30.0
